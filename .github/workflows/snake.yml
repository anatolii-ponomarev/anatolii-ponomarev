name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#2a9d82&color_dots=#edf1f2,#b5ced6,#8ba7bf,#677f9e,#465675
      - name: Publish updated calendar
        run: |
          sed -i 's|</style>|@media(prefers-color-scheme:dark){:root{--cs:#83e7bd;--ce:#202936;--c0:#202936;--c1:#354052;--c2:#4c5772;--c3:#6a7691;--c4:#929fba}}</style>|' assets/snake.svg
          git add -- assets/snake.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh contribution snake"
            git pull --rebase
            git push
          fi
